[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Scrape LinkedIn jobs via Apify, score them against your profile with Gemini, write to Google Sheets."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "gspread>=6.0",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "tzdata",  # Windows ships no time zone database; needed for Gemini's Pacific-time quota day
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
